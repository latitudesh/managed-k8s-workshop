site_name: Managed Kubernetes Workshop
site_description: Build your own managed Kubernetes provider, on your laptop.
site_url: https://latitudesh.github.io/managed-k8s-workshop/
repo_url: https://github.com/latitudesh/managed-k8s-workshop
repo_name: latitudesh/managed-k8s-workshop
edit_uri: edit/main/docs/
copyright: Latitude.sh

theme:
  name: material
  language: en
  features:
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Introduction: index.md
  - Setup:
      - 1. Prerequisites: 01-prerequisites.md
      - 2. Get the workshop files: 02-workshop-files.md
      - 3. Create the kind cluster (mgmt): 03-management-cluster.md
      - 4. Start cloud-provider-kind: 04-cloud-provider-kind.md
      - 5. Install Helm packages: 05-helm-packages.md
  - Hosted control plane:
      - 6. Create your first hosted control plane: 06-hosted-control-plane.md
      - 7. Join a worker node: 07-worker-node.md
  - Provider network:
      - 8. Simulate a managed Kubernetes network: 08-provider-network.md
      - 9. Run a workload: 09-workload.md
      - 10. Fix with Konnectivity: 10-konnectivity.md
  - Operations:
      - 11. Upgrade Kubernetes: 11-upgrade.md
      - 12. Manage add-ons with Sveltos: 12-sveltos.md
      - 13. Clean up: 13-clean-up.md
  - Bonus:
      - 14. Run it on LKS: 14-lks.md
