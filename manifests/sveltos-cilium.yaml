apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  # Cluster-scoped: one profile can serve many tenant clusters
  name: cilium
spec:
  # Apply to every registered cluster with this label
  clusterSelector:
    matchLabels:
      cni: cilium
  # Keep reconciling: changes to this profile are pushed to matching clusters
  syncMode: Continuous
  helmCharts:
    # The same chart, version and values as the manual install
    - repositoryURL: https://helm.cilium.io
      repositoryName: cilium
      chartName: cilium/cilium
      chartVersion: 1.20.2
      releaseName: cilium
      releaseNamespace: kube-system
      helmChartAction: Install
      values: |
        kubeProxyReplacement: true
        # Placeholder, replaced with the API server IP when you apply this file
        k8sServiceHost: TENANT_A_APISERVER_IP
        k8sServicePort: 6443
        ipam:
          mode: kubernetes
        operator:
          replicas: 1
